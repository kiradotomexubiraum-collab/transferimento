<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferência Direta P2P</title>
  <script src="https://unpkg.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    p { color: #94a3b8; font-size: 0.95rem; }
    input[type="file"] {
      display: block;
      width: 100%;
      margin: 1.5rem 0;
      padding: 10px;
      background: #0f172a;
      border: 1px dashed #475569;
      border-radius: 8px;
      color: #cbd5e1;
      box-sizing: border-box;
    }
    .link-box {
      display: none;
      margin-top: 1.5rem;
      text-align: left;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #38bdf8;
      font-size: 0.85rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    progress {
      width: 100%;
      height: 14px;
      margin-top: 1rem;
      display: none;
      border-radius: 7px;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #38bdf8;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- TELA DE ENVIO -->
  <div id="sender-ui">
    <h1>Enviar Arquivo Direto</h1>
    <p>Escolha um arquivo para gerar um link. Mantenha esta aba aberta até o download concluir.</p>
    
    <input type="file" id="file-input">
    
    <div class="link-box" id="link-box">
      <label style="font-size: 0.8rem; color: #94a3b8;">Envie este link para quem vai baixar:</label>
      <input type="text" id="share-link" readonly>
      <button id="copy-btn">Copiar Link</button>
    </div>
  </div>

  <!-- TELA DE RECEBIMENTO -->
  <div id="receiver-ui" style="display: none;">
    <h1>Baixar Arquivo</h1>
    <p id="file-info">Conectando ao remetente...</p>
    <button id="download-btn" style="display: none;">Iniciar Download</button>
  </div>

  <progress id="progress-bar" value="0" max="100"></progress>
  <div class="status" id="status-text"></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const hostId = urlParams.get('id');
  const CHUNK_SIZE = 65536; // 64KB por pacote para não travar o navegador

  const statusText = document.getElementById('status-text');
  const progressBar = document.getElementById('progress-bar');

  // MODO RECEPTOR (Quem abriu o link com ?id=...)
  if (hostId) {
    document.getElementById('sender-ui').style.display = 'none';
    document.getElementById('receiver-ui').style.display = 'block';

    const peer = new Peer();
    let receivedChunks = [];
    let receivedSize = 0;
    let fileMeta = null;

    peer.on('open', () => {
      const conn = peer.connect(hostId, { reliable: true });

      conn.on('open', () => {
        document.getElementById('file-info').textContent = 'Conectado! Aguardando dados...';
        conn.send({ type: 'ready' });
      });

      conn.on('data', (data) => {
        if (data.type === 'meta') {
          fileMeta = data;
          const sizeMB = (fileMeta.size / (1024 * 1024)).toFixed(2);
          document.getElementById('file-info').textContent = `Arquivo: ${fileMeta.name} (${sizeMB} MB)`;
          
          const dlBtn = document.getElementById('download-btn');
          dlBtn.style.display = 'block';
          dlBtn.onclick = () => {
            dlBtn.disabled = true;
            progressBar.style.display = 'block';
            statusText.textContent = 'Recebendo arquivo...';
            conn.send({ type: 'start' });
          };
        } else if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) {
          receivedChunks.push(data);
          receivedSize += data.byteLength;
          
          const percent = Math.round((receivedSize / fileMeta.size) * 100);
          progressBar.value = percent;
          statusText.textContent = `Baixando: ${percent}%`;

          if (receivedSize >= fileMeta.size) {
            statusText.textContent = 'Montando arquivo para salvar...';
            const blob = new Blob(receivedChunks, { type: fileMeta.mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileMeta.name;
            a.click();
            statusText.textContent = 'Download concluído!';
            receivedChunks = [];
          }
        }
      });

      conn.on('error', () => {
        statusText.textContent = 'Erro na conexão. Verifique se o remetente ainda está com a página aberta.';
      });
    });

  // MODO REMETENTE (Quem abriu o site normal para enviar)
  } else {
    const peer = new Peer();
    let selectedFile = null;

    peer.on('open', (id) => {
      const baseUrl = window.location.href.split('?')[0];
      const fullLink = `${baseUrl}?id=${id}`;
      document.getElementById('share-link').value = fullLink;
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        document.getElementById('link-box').style.display = 'block';
        statusText.textContent = 'Arquivo pronto. Aguardando alguém abrir o link...';
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const linkInput = document.getElementById('share-link');
      linkInput.select();
      navigator.clipboard.writeText(linkInput.value);
      statusText.textContent = 'Link copiado para a área de transferência!';
    });

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'ready' && selectedFile) {
          statusText.textContent = 'Destinatário conectado! Aguardando ele clicar em baixar...';
          conn.send({
            type: 'meta',
            name: selectedFile.name,
            size: selectedFile.size,
            mime: selectedFile.type
          });
        } else if (data.type === 'start' && selectedFile) {
          progressBar.style.display = 'block';
          sendFileInChunks(conn, selectedFile);
        }
      });
    });

    function sendFileInChunks(conn, file) {
      let offset = 0;
      const reader = new FileReader();

      reader.onload = (e) => {
        conn.send(e.target.result);
        offset += e.target.result.byteLength;

        const percent = Math.round((offset / file.size) * 100);
        progressBar.value = percent;
        statusText.textContent = `Enviando: ${percent}%`;

        if (offset < file.size) {
          // Pequena pausa se o buffer estiver cheio para evitar queda
          if (conn.dataChannel.bufferedAmount > 1024 * 1024) {
            setTimeout(() => readNextSlice(offset), 50);
          } else {
            readNextSlice(offset);
          }
        } else {
          statusText.textContent = 'Envio concluído com sucesso!';
        }
      };

      function readNextSlice(currentOffset) {
        const slice = file.slice(currentOffset, currentOffset + CHUNK_SIZE);
        reader.readAsArrayBuffer(slice);
      }

      readNextSlice(0);
    }
  }
</script>
</body>
</html>
