<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferência Direta P2P</title>
  <script src="https://unpkg.com"></script>
  <script src="https://cloudflare.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    p { color: #94a3b8; font-size: 0.95rem; }
    input[type="file"] {
      display: block;
      width: 100%;
      margin: 1.5rem 0 0.8rem 0;
      padding: 12px;
      background: #0f172a;
      border: 1px dashed #475569;
      border-radius: 8px;
      color: #cbd5e1;
      box-sizing: border-box;
      cursor: pointer;
    }
    .file-list {
      text-align: left;
      background: #0f172a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 1.2rem;
      max-height: 130px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: #cbd5e1;
      display: none;
    }
    .file-list div {
      padding: 4px 0;
      border-bottom: 1px solid #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-list div:last-child { border-bottom: none; }
    .link-box {
      display: none;
      margin-top: 1.2rem;
      text-align: left;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #38bdf8;
      font-size: 0.85rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    progress {
      width: 100%;
      height: 14px;
      margin-top: 1rem;
      display: none;
      border-radius: 7px;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #38bdf8;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- TELA DE ENVIO -->
  <div id="sender-ui">
    <h1>Enviar Arquivos Direto</h1>
    <p>Selecione um ou vários arquivos. Mantenha esta aba aberta até o download concluir.</p>
    
    <input type="file" id="file-input" multiple>
    <div class="file-list" id="file-list"></div>
    
    <div class="link-box" id="link-box">
      <label style="font-size: 0.8rem; color: #94a3b8;">Envie este link para quem vai baixar:</label>
      <input type="text" id="share-link" readonly>
      <button id="copy-btn">Copiar Link</button>
    </div>
  </div>

  <!-- TELA DE RECEBIMENTO -->
  <div id="receiver-ui" style="display: none;">
    <h1>Baixar Arquivos</h1>
    <p id="file-info">Conectando ao remetente...</p>
    <button id="download-btn" style="display: none;">Iniciar Download</button>
  </div>

  <progress id="progress-bar" value="0" max="100"></progress>
  <div class="status" id="status-text"></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const hostId = urlParams.get('id');
  const CHUNK_SIZE = 65536; // 64KB por pacote

  const statusText = document.getElementById('status-text');
  const progressBar = document.getElementById('progress-bar');

  // MODO RECEPTOR
  if (hostId) {
    document.getElementById('sender-ui').style.display = 'none';
    document.getElementById('receiver-ui').style.display = 'block';

    const peer = new Peer();
    let receivedChunks = [];
    let receivedSize = 0;
    let fileMeta = null;

    peer.on('open', () => {
      const conn = peer.connect(hostId, { reliable: true });

      conn.on('open', () => {
        document.getElementById('file-info').textContent = 'Conectado! Aguardando informações...';
        conn.send({ type: 'ready' });
      });

      conn.on('data', (data) => {
        if (data.type === 'meta') {
          fileMeta = data;
          const sizeMB = (fileMeta.size / (1024 * 1024)).toFixed(2);
          document.getElementById('file-info').textContent = `Pronto para baixar: ${fileMeta.name} (${sizeMB} MB)`;
          
          const dlBtn = document.getElementById('download-btn');
          dlBtn.style.display = 'block';
          dlBtn.onclick = () => {
            dlBtn.disabled = true;
            progressBar.style.display = 'block';
            statusText.textContent = 'Recebendo dados...';
            conn.send({ type: 'start' });
          };
        } else if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) {
          receivedChunks.push(data);
          receivedSize += data.byteLength;
          
          const percent = Math.round((receivedSize / fileMeta.size) * 100);
          progressBar.value = percent;
          statusText.textContent = `Baixando: ${percent}%`;

          if (receivedSize >= fileMeta.size) {
            statusText.textContent = 'Salvando arquivo no dispositivo...';
            const blob = new Blob(receivedChunks, { type: fileMeta.mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileMeta.name;
            a.click();
            statusText.textContent = 'Download concluído!';
            receivedChunks = [];
          }
        }
      });

      conn.on('error', () => {
        statusText.textContent = 'Erro na conexão. Verifique se o remetente ainda está com a página aberta.';
      });
    });

  // MODO REMETENTE
  } else {
    const peer = new Peer();
    let payloadToSend = null;
    let payloadName = '';
    let payloadMime = '';

    peer.on('open', (id) => {
      const baseUrl = window.location.href.split('?')[0];
      const fullLink = `${baseUrl}?id=${id}`;
      document.getElementById('share-link').value = fullLink;
    });

    document.getElementById('file-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const fileListEl = document.getElementById('file-list');
      fileListEl.innerHTML = '';
      fileListEl.style.display = 'block';
      document.getElementById('link-box').style.display = 'none';

      files.forEach(f => {
        const item = document.createElement('div');
        const sizeMB = (f.size / (1024 * 1024)).toFixed(1);
        item.textContent = `📄 ${f.name} (${sizeMB} MB)`;
        fileListEl.appendChild(item);
      });

      if (files.length === 1) {
        payloadToSend = files[0];
        payloadName = files[0].name;
        payloadMime = files[0].type || 'application/octet-stream';
        
        document.getElementById('link-box').style.display = 'block';
        statusText.textContent = 'Arquivo pronto! Copie o link abaixo.';
      } else {
        statusText.textContent = `Empacotando ${files.length} arquivos em um .zip...`;
        progressBar.style.display = 'block';
        progressBar.value = 0;

        const zip = new JSZip();
        files.forEach(file => {
          zip.file(file.name, file);
        });

        const zipBlob = await zip.generateAsync(
          { type: 'blob', compression: 'STORE' },
          (metadata) => {
            const percent = Math.round(metadata.percent);
            progressBar.value = percent;
            statusText.textContent = `Preparando pacote: ${percent}%`;
          }
        );

        payloadToSend = zipBlob;
        payloadName = `arquivos_${files.length}_itens.zip`;
        payloadMime = 'application/zip';

        progressBar.style.display = 'none';
        document.getElementById('link-box').style.display = 'block';
        statusText.textContent = 'Pacote pronto! Aguardando alguém abrir o link...';
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const linkInput = document.getElementById('share-link');
      linkInput.select();
      navigator.clipboard.writeText(linkInput.value);
      statusText.textContent = 'Link copiado para a área de transferência!';
    });

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'ready' && payloadToSend) {
          statusText.textContent = 'Destinatário conectado! Aguardando ele clicar em baixar...';
          conn.send({
            type: 'meta',
            name: payloadName,
            size: payloadToSend.size,
            mime: payloadMime
          });
        } else if (data.type === 'start' && payloadToSend) {
          progressBar.style.display = 'block';
          progressBar.value = 0;
          sendBlobInChunks(conn, payloadToSend);
        }
      });
    });

    function sendBlobInChunks(conn, blob) {
      let offset = 0;
      const reader = new FileReader();

      reader.onload = (e) => {
        conn.send(e.target.result);
        offset += e.target.result.byteLength;

        const percent = Math.round((offset / blob.size) * 100);
        progressBar.value = percent;
        statusText.textContent = `Enviando: ${percent}%`;

        if (offset < blob.size) {
          if (conn.dataChannel.bufferedAmount > 1024 * 1024) {
            setTimeout(() => readNextSlice(offset), 50);
          } else {
            readNextSlice(offset);
          }
        } else {
          statusText.textContent = 'Envio concluído com sucesso!';
        }
      };

      function readNextSlice(currentOffset) {
        const slice = blob.slice(currentOffset, currentOffset + CHUNK_SIZE);
        reader.readAsArrayBuffer(slice);
      }

      readNextSlice(0);
    }
  }
</script>
</body>
</html>
